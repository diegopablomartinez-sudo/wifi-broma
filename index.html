<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiFi Gratis</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.caja {
    padding: 30px;
    width: 90%;
    max-width: 500px;
}

h1 {
    font-size: 38px;
    margin-bottom: 15px;
}

p {
    font-size: 20px;
}

button {
    margin-top: 25px;
    padding: 18px 45px;
    font-size: 22px;
    font-weight: bold;
    border: 0;
    border-radius: 12px;
    background: #19b84b;
    color: white;
    cursor: pointer;
}

#broma {
    display: none;
}

#broma h1 {
    font-size: 42px;
    line-height: 1.2;
}
</style>
</head>

<body>

<div class="caja">

    <div id="wifi">
        <h1>📶 WiFi GRATIS</h1>
        <p>Conectate a nuestra red</p>
        <button onclick="conectar()">CONECTAR</button>
    </div>

    <div id="broma">
        <h1>😂 LA PRÓXIMA VEZ<br>
        PAGÁ LOS DATOS,<br>
        NO SEAS MISERIA 😂</h1>
    </div>

    <audio id="audio">
        <source src="https://www.memes.casa/wp-content/uploads/2019/01/gemido-whatsapp.mp3" type="audio/mpeg">
    </audio>

</div>

<script>
function conectar() {
    document.getElementById("wifi").style.display = "none";
    document.getElementById("broma").style.display = "block";

    const audio = document.getElementById("audio");
    audio.volume = 1;
    audio.play();
}
</script>

</body>
</html>
